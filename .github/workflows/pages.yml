name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 楽天アフィリエイトはいま止めている。再開するときは、下の4行の先頭の「# 」を外し、
      # assets/app.js の RAKUTEN_ON を true にし、各ページのフッターに広告の表示を戻す
      # - name: Fetch Rakuten items
      #   env:
      #     RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      #     RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      #   run: python3 tools/fetch_rakuten.py
      - name: Build pages from data
        # tools/__pycache__ を作らない(公開するファイルに混ぜない)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/build_kura.py
          python3 tools/build_columns.py
          python3 tools/build_sitemap.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
