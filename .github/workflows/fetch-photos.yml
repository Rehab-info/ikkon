name: Fetch photos

on:
  push:
    branches: [main]
    paths: [tools/photos.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download listed photos
        run: |
          grep -v '^#' tools/photos.txt | while read -r path url rest; do
            [ -z "$path" ] && continue
            if [ ! -f "$path" ]; then
              mkdir -p "$(dirname "$path")"
              curl -fsSL -A "Mozilla/5.0" -o "$path" "$url"
              echo "saved $path"
            fi
          done
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "写真を取得(tools/photos.txt)"
          git push
