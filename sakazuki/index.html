.photo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

details[open] summary{margin-bottom:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}

.tile{aspect-ratio:1;max-width:100%;border:0;border-radius:4px;background:var(--paper);color:var(--muted);font-size:clamp(8px,2.3vw,11px);padding:0;display:grid;place-items:center;line-height:1}

.backup .actions{justify-content:flex-start}

@media (max-width:420px){.two{grid-template-columns:1fr}.brand{font-size:30px}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:active{transform:scale(.98)}}

.app-foot{margin-top:32px}
.family{display:grid;gap:8px;padding-top:14px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.family-h{font-size:12px;letter-spacing:.12em}

</style>

 {id:"s3",sample:true,name:"出羽桜 桜花吟醸",brewery:"出羽桜酒造",pref:"山形",grade:"吟醸",type:"お店で",date:"2026-09-28",rating:4,sweet:-1,body:-1,temp:"雪冷え",place:"国分町の居酒屋",memo:""}
];

const S={entries:[],loaded:false,mode:"loading",view:"list",type:"all",q:"",sort:"date",pref:null,detail:null,confirm:false,draft:null,
  syncError:null,lastCard:null,importing:null,backupMsg:"",hint:false,slow:false,handoff:null};
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==="function");
let col=null, unsub=null, downloads=null;
const LS_KEY="mycolle.entries.v1", HINT_KEY="sakazuki.hint.closed";
// 端末の保存領域(IndexedDB)の応答をこれだけ待っても読み込めないときは、状況を説明する。
// ふだんは1秒もかからない。記録や写真が多い古い端末でも収まり、待たせすぎない長さにしている
const LOCAL_WAIT=6000;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const newId=()=>"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function cupsSvg(n){let h="";for(let i=1;i<=5;i++)h+=`<svg viewBox="0 0 14 12" aria-hidden="true"><path class="${i<=n?"on":"off"}" d="M1 1h12l-2.2 8.2A2 2 0 0 1 8.9 11H5.1a2 2 0 0 1-1.9-1.8z"/></svg>`;return `<span class="cups" role="img" aria-label="評価 ${n} / 5">${h}</span>`}
function labelHtml(e){
  const cup=e.type==="ワンカップ";
  return `<div class="label${cup?" cup":""}"><span class="v">${esc(e.name||"無銘")}</span>${e.grade?`<span class="g">${esc(e.grade)}</span>`:""}${e.pref?`<span class="seal">${esc((SHORT[e.pref]||e.pref).slice(0,2))}</span>`:""}</div>`;
}
function picHtml(e){return e.photo?`<img src="${esc(e.photo)}" alt="${esc(e.name)}の写真">`:labelHtml(e)}

/* ---------- storage: this device (IndexedDB, else localStorage) ---------- */
function lsRead(){try{const v=JSON.parse(localStorage.getItem(LS_KEY)||"[]");return Array.isArray(v)?v:[]}catch(_){return[]}}
const Local={
  idb:null,
  open(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("no idb"));
    const r=indexedDB.open("sakazuki",1);r.onupgradeneeded=()=>r.result.createObjectStore("entries",{keyPath:"id"});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"))})},
  tx(mode,fn){return new Promise((res,rej)=>{let t;try{t=this.idb.transaction("entries",mode)}catch(e){rej(e);return}
    const req=fn(t.objectStore("entries"));t.oncomplete=()=>res(req&&req.result);t.onerror=t.onabort=()=>rej(t.error)})},
  async init(){
    try{this.idb=await this.open()}catch(_){this.idb=null;return}
    // carry over records kept by earlier versions in localStorage
    const old=lsRead();
    if(old.length){try{await this.tx("readwrite",s=>{old.forEach(e=>{if(e&&e.id)s.put(e)})});localStorage.removeItem(LS_KEY)}catch(_){}}
  },
  async all(){if(this.idb)return(await this.tx("readonly",s=>s.getAll()))||[];return lsRead()},
  async put(e){
    if(this.idb){await this.tx("readwrite",s=>s.put(e));return}
    const list=lsRead().filter(x=>x.id!==e.id);list.push(e);localStorage.setItem(LS_KEY,JSON.stringify(list));
  },
  async del(id){
    if(this.idb){await this.tx("readwrite",s=>s.delete(id));return}
    localStorage.setItem(LS_KEY,JSON.stringify(lsRead().filter(x=>x.id!==id)));
  }
};

/* ---------- storage: either backend ---------- */
async function retry1(fn){try{return await fn()}catch(e){if(e&&e.code==="unavailable"){await wait(300+Math.random()*500);return fn()}throw e}}
function strip(e){const o={};FIELDS.forEach(k=>{if(e[k]!==undefined)o[k]=e[k]});return o}
async function persist(e){
  if(S.mode==="loading")throw{code:"loading"};   // 読み込みが終わるまでは保存しない(別の保存先に書かない)
  if(S.mode==="db"){await retry1(()=>col.doc(e.id).set(strip(e)));return}
  try{await Local.put(e)}catch(_){throw{code:"local"}}
  const i=S.entries.findIndex(x=>x.id===e.id);if(i>=0)S.entries[i]=e;else S.entries.push(e);
  refresh();
}
async function remove(id){
  if(S.mode==="loading")throw{code:"loading"};
  if(S.mode==="db"){await retry1(()=>col.doc(id).delete());return}
  await Local.del(id);S.entries=S.entries.filter(x=>x.id!==id);refresh();
}
let localStarted=false;
async function useLocal(){
  if(localStarted)return;localStarted=true;                // 二重に読み込まない
  // 応答が遅いときは説明を出すだけで、ほかの保存先には切り替えない。遅れて応答したら、そのまま読み込む
  const slow=setTimeout(()=>{if(!S.loaded){S.slow=true;refresh()}},LOCAL_WAIT);
  await Local.init();
  try{S.entries=await Local.all()}catch(_){S.entries=[]}
  clearTimeout(slow);
  S.slow=false;S.mode="local";S.loaded=true;refresh();
  if(!IN_CLAUDE&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
function subscribe(){
  if(unsub){try{unsub()}catch(_){}}
  S.syncError=null;renderChrome();
  unsub=col.onSnapshot(snap=>{S.entries=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded=true;S.syncError=null;refresh()},
    err=>{unsub=null;S.syncError=(err&&err.code)||"unavailable";refresh()});
}

/* ---------- 一献・カップ酒図鑑からの引き継ぎ(#add?…) ---------- */
// 銘柄の公開情報だけを受け取り、新規記録の下書きに入れる。保存は「記録する」を押したときだけ。
// 受け取るのは決まった項目だけで、形や長さが合わないものは使わない。読めないURLは無視して普段どおり開く
const HANDOFF_FROM={ikkon:"一献",cupzukan:"カップ酒図鑑"};
function readHandoff(){
  const h=location.hash||"";
  if(!/^#add(\?|$)/.test(h))return null;
  try{history.replaceState(null,"",location.pathname+location.search)}catch(_){} // 再読み込み・戻る・進むで二度入れない
  if(h.length>2000)return null;
  let q;try{q=new URLSearchParams(h.slice(5))}catch(_){return null}
  const txt=(k,n)=>{const v=q.get(k);return typeof v==="string"&&!v.includes("\ufffd")?v.normalize("NFC").replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g,"").trim().slice(0,n):""};
  const pct=k=>{const v=txt(k,8).replace(/%$/,"");return /^\d{1,3}(\.\d)?$/.test(v)&&+v>=1&&+v<=100?v:""};
  const from=txt("from",10),name=txt("name",60);
  if(!Object.prototype.hasOwnProperty.call(HANDOFF_FROM,from)||!name)return null;
  const pref=txt("pref",4),grade=txt("grade",30).replace(/[（(].*$/,"");
  return{from,draft:Object.assign(blankDraft(),{
    type:from==="cupzukan"&&txt("type",10)==="ワンカップ"?"ワンカップ":"",   // 一献からは容器を選ばずに開く
    name,brewery:txt("brewery",60),pref:PREFS.includes(pref)?pref:"",grade:GRADES.includes(grade)?grade:"",
    polish:pct("polish"),abv:pct("abv")})};
}
function handoffHtml(){
  const h=S.handoff;if(!h||!S.draft||S.draft!==h.draft)return "";   // 引き継いだ下書きにだけ出す
  return `<div class="notice" role="status"><span><b>${esc(HANDOFF_FROM[h.from])}から銘柄を入れました。</b><br>「記録する」を押すまで保存されません。</span>${h.ios?`<span>ホーム画面のさかづき帳をお使いの方は、そちらで記録してください。Safari で開いたこの画面で記録すると、ホーム画面のアプリとは別の場所に保存されます。</span><div class="actions"><button type="button" class="btn ghost" id="copyName">銘柄名をコピー</button></div>`:""}</div>`;
}
async function copyName(){
  readForm();const v=S.draft&&S.draft.name||"";let ok=false;
  try{await navigator.clipboard.writeText(v);ok=true}catch(_){
    try{const t=document.createElement("textarea");t.value=v;t.setAttribute("readonly","");t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();ok=document.execCommand("copy");t.remove()}catch(_){}}
  toast(ok?"銘柄名をコピーしました":"コピーできませんでした。銘柄名を長押ししてコピーしてください");
}

async function boot(){
  const h=readHandoff();
  if(h){S.draft=h.draft;S.view="form";S.handoff={from:h.from,draft:h.draft,ios:false}}
  render();
  if(!IN_CLAUDE){setupPwa();await useLocal();return}
  try{
    const c=window.claude;
    const [db,user,dl]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads")]);
    downloads=dl;
    const uid=user?await user.id():null;
    if(!db||!uid){await useLocal();return}
    col=db.doc("data/users/"+uid+"/profile").collection("cups");
    S.mode="db";
    subscribe();
  }catch(_){await useLocal()}
}

/* ---------- PWA ---------- */
function setupPwa(){
  if("serviceWorker" in navigator&&window.isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  let closed=false;try{closed=localStorage.getItem(HINT_KEY)==="1"}catch(_){}
  S.hint=ios&&navigator.standalone===false&&!closed;
  if(S.handoff){S.handoff.ios=ios&&navigator.standalone===false;if(S.view==="form")render()}
}

/* ---------- derived ---------- */
function shown(){
  const real=S.entries;
  let list=(real.length||!S.loaded)?real.slice():SAMPLES.slice();
  if(S.type==="cup")list=list.filter(e=>e.type==="ワンカップ");
  else if(S.type==="bottle")list=list.filter(e=>["四合瓶","一升瓶","小瓶"].includes(e.type));
  else if(S.type==="shop")list=list.filter(e=>e.type==="お店で");
  if(S.pref)list=list.filter(e=>e.pref===S.pref);
  const q=S.q.trim().toLowerCase();
  if(q)list=list.filter(e=>[e.name,e.brewery,e.pref,e.place,e.memo,e.grade].join(" ").toLowerCase().includes(q));
  if(S.sort==="rating")list.sort((a,b)=>(b.rating||0)-(a.rating||0)||String(b.date).localeCompare(a.date));
  else if(S.sort==="pref")list.sort((a,b)=>PREFS.indexOf(a.pref)-PREFS.indexOf(b.pref)||String(b.date).localeCompare(a.date));
  else list.sort((a,b)=>String(b.date).localeCompare(a.date)||String(b.id).localeCompare(a.id));
  return list;
}

/* ---------- render ---------- */
// header, stats and notices: safe to redraw at any time
function renderChrome(){
  const E=S.entries;
  $("#sCount").textContent=E.length;
  $("#sBrand").textContent=new Set(E.map(e=>(e.name||"").trim()).filter(Boolean)).size;
  $("#sPref").textContent=new Set(E.map(e=>e.pref).filter(Boolean)).size;
  $("#sCup").textContent=E.filter(e=>e.type==="ワンカップ").length;
  const st=$("#saveState");
  st.textContent=S.syncError?"同期が切れています":S.mode==="db"?"アカウントに保存":S.mode==="local"?"この端末に保存":S.slow?"応答を待っています":"読み込み中…";
  st.classList.toggle("bad",!!S.syncError||S.slow);
  let n="";
  if(S.syncError)n+=`<div class="notice bad" role="alert">${S.syncError==="revoked"?"この記録帳を開く権限が変わりました。ページを開き直してください。":`アカウントとの同期が切れました。記録は消えていません。<div class="actions"><button class="btn" id="resync">つなぎ直す</button></div>`}</div>`;
  if(S.slow)n+=`<div class="notice bad" role="alert"><span><b>記録の読み込みに時間がかかっています。</b><br>この端末の保存領域から、まだ応答がありません。記録や写真が多いと時間がかかることがあります。記録は消えていません。このまま待つか、再読み込みしてください。直らないときは、さかづき帳を開いているほかのタブやアプリを閉じてから、もう一度開いてください。</span><div class="actions"><button class="btn" id="reloadApp">再読み込みする</button></div></div>`;
  if(S.hint)n+=`<div class="notice"><span><b>ホーム画面に追加すると、アプリとして使えます。</b><br>Safari の共有ボタン（□↑）→「ホーム画面に追加」。Safari で付けた記録はアプリへ移らないので、先に追加してから記録してください。</span><div class="actions"><button class="btn ghost" id="hintClose">閉じる</button></div></div>`;
  $("#notice").innerHTML=n;
}
// full redraw of the current view (navigation, filters)
function render(){
  renderChrome();
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.view===S.view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const v=$("#view");
  if(S.view==="form"){v.innerHTML=formHtml();bindForm()}
  else if(S.view==="map")v.innerHTML=mapHtml();
  else v.innerHTML=listHtml();
  renderSheet(true);
}
// records changed: redraw only what shows records, never the form or the search box
function refresh(){
  renderChrome();
  if(S.view==="list")renderResults();
  else if(S.view==="map")$("#view").innerHTML=mapHtml();
  if(S.detail)renderSheet(false);
}
function renderResults(){const r=$("#results");if(r)r.innerHTML=resultsHtml()}

function listHtml(){
  const chip=(k,t)=>`<button class="chip" data-type="${k}" aria-pressed="${S.type===k}">${t}</button>`;
  return `<div class="toolbar"><div class="chips">${chip("all","すべて")}${chip("cup","カップ酒")}${chip("bottle","瓶")}${chip("shop","お店で")}</div>
  <div class="row"><input class="search" id="q" type="search" placeholder="銘柄・蔵元・場所で検索" value="${esc(S.q)}">
  <select class="sort" id="sort" aria-label="並び順"><option value="date"${S.sort==="date"?" selected":""}>新しい順</option><option value="rating"${S.sort==="rating"?" selected":""}>評価順</option><option value="pref"${S.sort==="pref"?" selected":""}>北から</option></select></div>
  ${S.pref?`<div class="pref-filter">${esc(S.pref)}の記録 <button id="clearPref">解除</button></div>`:""}</div>
  <div id="results">${resultsHtml()}</div>`;
}
function resultsHtml(){
  if(!S.loaded)return S.syncError?`<p class="empty">記録を読み込めませんでした。上の「つなぎ直す」を押してください。</p>`:S.slow?`<p class="empty">記録の読み込みを待っています。上の案内をご覧ください。</p>`:`<p class="empty">記録を読み込んでいます…</p>`;
  const list=shown();
  let h=S.entries.length?"":`<div class="empty"><strong>まだ記録がありません</strong>下の3枚は見本です。「記録する」から最初の1杯を残しましょう。</div>`;
  if(!list.length)return h+`<p class="empty">条件に合う記録はありません。</p>`;
  return h+`<div class="grid">`+list.map(e=>`<button class="card" data-id="${esc(e.id)}"><div class="pic">${picHtml(e)}<span class="badge">${esc(typeLabel(e.type))}</span>${e.sample?`<span class="badge sample">見本</span>`:""}</div>
   <div class="meta"><span class="name">${esc(e.name||"無銘")}</span><span class="sub">${esc([e.pref,e.grade].filter(Boolean).join("・"))}</span><span class="sub">${esc((e.date||"").replace(/-/g,"."))}</span>${cupsSvg(e.rating||0)}</div></button>`).join("")+`</div>`;
}

function mapHtml(){
  const E=S.entries;
  const cnt={};E.forEach(e=>{if(e.pref)cnt[e.pref]=(cnt[e.pref]||0)+1});
  const done=Object.keys(cnt).length;
  let tiles="";
  PREFS.forEach(p=>{const [c,r]=TILE[p],n=cnt[p]||0,l=n>=5?3:n>=2?2:n>=1?1:0;
    tiles+=`<button class="tile${l?" l"+l:""}" style="grid-column:${c+1};grid-row:${r+1}" data-pref="${p}" aria-label="${p} ${n}件">${SHORT[p]||p}</button>`});
  const pts=E.filter(e=>Number.isFinite(e.sweet)&&Number.isFinite(e.body));
  const W=320,H=260,pad=34,sx=v=>pad+(v+2)/4*(W-2*pad),sy=v=>H-pad-(v+2)/4*(H-2*pad);
  const jitter=(i)=>((i*37)%11-5)*1.2;
  const dots=pts.map((e,i)=>`<circle class="dot" cx="${sx(e.sweet)+jitter(i)}" cy="${sy(e.body)+jitter(i+3)}" r="${4+(e.rating||3)}"><title>${esc(e.name)}</title></circle>`).join("");
  return `<section class="panel"><h2>制覇マップ</h2><p class="note">${done?`47都道府県のうち ${done} 県の酒を記録。タイルを押すとその県の記録を表示します。`:"記録すると、飲んだ酒の都道府県が色づきます。"}</p>
  <div class="tilemap">${tiles}</div>
  <div class="legend"><span><i style="background:var(--accent-soft)"></i>1杯</span><span><i style="background:color-mix(in srgb,var(--accent) 55%,var(--accent-soft))"></i>2〜4杯</span><span><i style="background:var(--accent)"></i>5杯以上</span></div></section>
  <section class="panel flavor"><h2>味わいマップ</h2><p class="note">${pts.length?"記録した味わいの分布です。円が大きいほど評価が高い酒です。":"記録時に甘辛・淡麗濃醇を選ぶと、ここに好みの傾向が現れます。"}</p>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="甘辛と淡麗濃醇の散布図">
   <rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" fill="none" class="ax"/>
   <line class="ax" x1="${W/2}" y1="${pad}" x2="${W/2}" y2="${H-pad}"/><line class="ax" x1="${pad}" y1="${H/2}" x2="${W-pad}" y2="${H/2}"/>
   <text x="${pad}" y="${H-pad+18}">甘口</text><text x="${W-pad}" y="${H-pad+18}" text-anchor="end">辛口</text>
   <text x="${W/2}" y="${pad-10}" text-anchor="middle">濃醇</text><text x="${W/2}" y="${H-8}" text-anchor="middle">淡麗</text>
   ${dots}</svg></section>
  ${backupHtml()}`;
}
function backupHtml(){
  const imp=S.importing;
  return `<section class="panel backup"><h2>記録の書き出し・読み込み</h2>
  <p class="note">記録をファイルに書き出して残せます。機種変更のときや、Claude 版とアプリ版のあいだで記録を移すときにも使えます。</p>
  ${imp?`<div class="confirm">${imp.length}件の記録を読み込みます。同じ記録がすでにあれば、ファイルの内容で上書きします。<div class="actions"><button class="btn ghost" id="impNo">やめる</button><button class="btn" id="impYes">読み込む</button></div></div>`:
  `<div class="actions"><button class="btn ghost" id="expBtn"${S.entries.length?"":" disabled"}>書き出す</button><label class="btn ghost" for="impFile" style="display:inline-block">読み込む</label><input id="impFile" type="file" accept=".json,application/json" hidden></div>`}
  ${S.backupMsg?`<p class="msg" role="status">${esc(S.backupMsg)}</p>`:""}</section>`;
}

function formHtml(){
  const d=S.draft;
  const seg=(name,arr,val,lab)=>`<div class="seg" data-seg="${name}">${arr.map(a=>{const k=Array.isArray(a)?a[0]:a;return `<button type="button" data-v="${esc(k)}" aria-pressed="${val===k}">${esc(lab?lab(k):k)}${Array.isArray(a)&&a[1]?`<small>${a[1]}</small>`:""}</button>`}).join("")}</div>`;
  let rate="";for(let i=1;i<=5;i++)rate+=`<button type="button" data-r="${i}" aria-label="${i}"><svg viewBox="0 0 14 12"><path class="${i<=d.rating?"on":"off"}" d="M1 1h12l-2.2 8.2A2 2 0 0 1 8.9 11H5.1a2 2 0 0 1-1.9-1.8z" style="${i<=d.rating?"fill:var(--gold)":"fill:none;stroke:var(--muted);stroke-width:1"}"/></svg></button>`;
  const has=v=>v!==""&&v!=null;
  return `<form id="f" novalidate><div><h2>${d.id?"記録を直す":"今日の一杯を記録"}</h2></div>${handoffHtml()}
  <div class="field"><span class="lbl">種類</span>${seg("type",TYPES,d.type,typeLabel)}</div>
  <div class="field"><label for="fName">銘柄</label><input id="fName" type="text" required maxlength="60" placeholder="例：浦霞 禅" value="${esc(d.name)}"></div>
  <div class="two"><div class="field"><label for="fBrew">蔵元</label><input id="fBrew" type="text" maxlength="60" placeholder="例：佐浦" value="${esc(d.brewery)}"></div>
   <div class="field"><label for="fPref">都道府県</label><select id="fPref"><option value="">選ぶ</option>${PREFS.map(p=>`<option${d.pref===p?" selected":""}>${p}</option>`).join("")}</select></div></div>
  <div class="field"><span class="lbl">特定名称</span>${seg("grade",GRADES,d.grade)}</div>
  <div class="two"><div class="field"><label for="fDate">飲んだ日</label><input id="fDate" type="date" value="${esc(d.date)}"></div>
   <div class="field"><label for="fPlace">場所</label><input id="fPlace" type="text" maxlength="60" placeholder="自宅、店名など" value="${esc(d.place)}"></div></div>
  <div class="field"><span class="lbl">評価</span><div class="rate" id="rate">${rate}</div></div>
  <div class="field"><span class="lbl">味わい</span>
   <div class="scale"><span>甘口</span><input id="fSweet" type="range" min="-2" max="2" step="1" value="${d.sweet}" aria-label="甘口から辛口"><span>辛口</span></div>
   <div class="scale"><span>淡麗</span><input id="fBody" type="range" min="-2" max="2" step="1" value="${d.body}" aria-label="淡麗から濃醇"><span>濃醇</span></div></div>
  <div class="field"><span class="lbl">温度</span>${seg("temp",TEMPS,d.temp)}</div>
  <div class="field"><span class="lbl">写真</span><div class="photo-row">${d.photo?`<img class="photo-prev" src="${esc(d.photo)}" alt="選んだ写真">`:""}
   <label class="btn ghost" for="fPhoto" style="display:inline-block">${d.photo?"写真を変える":"ラベルを撮る・選ぶ"}</label><input id="fPhoto" type="file" accept="image/*" hidden>
   ${d.photo?`<button type="button" class="btn ghost" id="rmPhoto">外す</button>`:""}</div></div>
  <details${has(d.smv)||has(d.polish)||has(d.abv)||has(d.price)?" open":""}><summary>ラベルの数値・価格（任意）</summary>
   <div class="three"><div class="field"><label for="fSmv">日本酒度</label><input id="fSmv" type="number" inputmode="decimal" step="0.5" value="${esc(d.smv)}"></div>
   <div class="field"><label for="fPolish">精米歩合 %</label><input id="fPolish" type="number" inputmode="numeric" min="1" max="100" value="${esc(d.polish)}"></div>
   <div class="field"><label for="fAbv">度数 %</label><input id="fAbv" type="number" inputmode="decimal" step="0.1" value="${esc(d.abv)}"></div></div>
   <div class="field" style="margin-top:10px"><label for="fPrice">価格（円）</label><input id="fPrice" type="number" inputmode="numeric" min="0" value="${esc(d.price)}"></div></details>
  <div class="field"><label for="fMemo">メモ</label><textarea id="fMemo" maxlength="1000" placeholder="香り、合わせた料理、一緒に飲んだ人など">${esc(d.memo)}</textarea></div>
  <p class="err" id="fErr" hidden></p>
  <div class="actions"><button type="button" class="btn ghost" id="cancel">やめる</button><button type="submit" class="btn" id="save">${d.id?"保存する":"記録する"}</button></div></form>`;
}
function blankDraft(){return{id:null,type:"ワンカップ",name:"",brewery:"",pref:"",grade:"",date:today(),place:"",rating:3,sweet:0,body:0,temp:"",photo:"",smv:"",polish:"",abv:"",price:"",memo:""}}

function readForm(){
  if(!S.draft||!$("#f"))return;
  const d=S.draft,v=id=>$(id).value;
  Object.assign(d,{name:v("#fName").trim(),brewery:v("#fBrew").trim(),pref:v("#fPref"),date:v("#fDate")||today(),place:v("#fPlace").trim(),
   sweet:+v("#fSweet"),body:+v("#fBody"),smv:v("#fSmv"),polish:v("#fPolish"),abv:v("#fAbv"),price:v("#fPrice"),memo:v("#fMemo")});
}
function saveErr(err){
  const c=err&&err.code;
  if(c==="quota_exceeded")return "保存容量がいっぱいです。古い記録の写真を外すか削除してください。";
  if(c==="invalid_argument"||c==="transform_error")return "写真が大きすぎて保存できませんでした。写真を外すか、撮り直してください。";
  if(c==="loading")return "記録の読み込みが終わっていないため、まだ保存できません。読み込みが終わってから、もう一度押してください。";
  if(c==="local")return "この端末に保存できませんでした。写真を外すと保存できる場合があります。";
  return "保存できませんでした。通信を確かめて、もう一度押してください。";
}
function bindForm(){
  const f=$("#f");
  f.querySelectorAll("[data-seg]").forEach(g=>g.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;readForm();const k=g.dataset.seg;S.draft[k]=S.draft[k]===b.dataset.v&&k!=="type"?"":b.dataset.v;render()}));
  $("#rate").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;readForm();S.draft.rating=+b.dataset.r;render()});
  $("#fPhoto").addEventListener("change",async ev=>{const file=ev.target.files&&ev.target.files[0];if(!file)return;readForm();
    try{S.draft.photo=await shrink(file)}catch(_){showErr("写真を読み込めませんでした。別の画像を選んでください。");return}render()});
  const rm=$("#rmPhoto");if(rm)rm.addEventListener("click",()=>{readForm();S.draft.photo="";render()});
  const cp=$("#copyName");if(cp)cp.addEventListener("click",copyName);
  $("#cancel").addEventListener("click",()=>{S.draft=null;S.handoff=null;go("list")});
  f.addEventListener("submit",async ev=>{ev.preventDefault();readForm();const d=S.draft;
    if(!d.name){showErr("銘柄を入れてください。");$("#fName").focus();return}
    if(!TYPES.includes(d.type)){showErr("種類を選んでください。");return}
    const e=Object.assign({},d,{id:d.id||newId(),updatedAt:Date.now()});
    $("#save").disabled=true;
    try{await persist(e);const wasEdit=!!d.id;S.draft=null;S.handoff=null;S.pref=null;go("list");toast(wasEdit?"保存しました":"記録しました")}
    catch(err){const b=$("#save");if(b)b.disabled=false;showErr(saveErr(err))}
  });
}
function showErr(m){const p=$("#fErr");if(p){p.textContent=m;p.hidden=false}}
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{let m=640,q=.8,out="";for(let t=0;t<4;t++){const s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<180000)break;m*=.8;q-=.1}URL.revokeObjectURL(url);res(out)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

/* ---------- backup ---------- */
function sanitize(x){
  if(!x||typeof x!=="object"||typeof x.name!=="string"||!x.name.trim())return null;
  const str=(v,n)=>typeof v==="string"?v.slice(0,n):"", num=v=>v===""||v==null||!Number.isFinite(+v)?"":String(v);
  const int=(v,lo,hi,dflt)=>Number.isInteger(+v)&&+v>=lo&&+v<=hi?+v:dflt;
  return{id:typeof x.id==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(x.id)?x.id:newId(),
    type:TYPES.includes(x.type)?x.type:x.type==="カップ酒"?"ワンカップ":"四合瓶",name:str(x.name,60).trim(),brewery:str(x.brewery,60),pref:PREFS.includes(x.pref)?x.pref:"",
    grade:GRADES.includes(x.grade)?x.grade:"",date:/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:today(),place:str(x.place,60),
    rating:int(x.rating,1,5,3),sweet:int(x.sweet,-2,2,0),body:int(x.body,-2,2,0),temp:TEMPS.some(t=>t[0]===x.temp)?x.temp:"",
    photo:typeof x.photo==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(x.photo)&&x.photo.length<250000?x.photo:"",
    smv:num(x.smv),polish:num(x.polish),abv:num(x.abv),price:num(x.price),memo:str(x.memo,1000),updatedAt:Number.isFinite(x.updatedAt)?x.updatedAt:Date.now()};
}
async function exportAll(){
  const data=JSON.stringify({app:"sakazuki-cho",version:1,exportedAt:new Date().toISOString(),entries:S.entries.map(e=>Object.assign({id:e.id},strip(e)))});
  const name="sakazuki-"+today().replace(/-/g,"")+".json";
  S.backupMsg="";
  try{
    if(IN_CLAUDE){
      if(!downloads){S.backupMsg="この画面からは書き出せません。";return}
      await downloads.save({filename:name,data});S.backupMsg=S.entries.length+"件を書き出しました。";return;
    }
    const file=new File([data],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"さかづき帳の記録"});S.backupMsg="書き出しました。";return}
    const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);S.backupMsg=S.entries.length+"件を書き出しました。";
  }catch(err){
    S.backupMsg=err&&(err.code==="declined"||err.name==="AbortError")?"書き出しをやめました。":"書き出せませんでした。";
  }finally{if(S.view==="map")$("#view").innerHTML=mapHtml()}
}
async function readImport(file){
  S.backupMsg="";
  try{
    const v=JSON.parse(await file.text());
    const list=(Array.isArray(v)?v:v&&Array.isArray(v.entries)?v.entries:[]).map(sanitize).filter(Boolean);
    if(!list.length)S.backupMsg="読み込める記録が見つかりませんでした。さかづき帳で書き出したファイルを選んでください。";
    else S.importing=list;
  }catch(_){S.backupMsg="ファイルを読めませんでした。さかづき帳で書き出したファイルを選んでください。"}
  $("#view").innerHTML=mapHtml();
}
async function runImport(){
  if(S.mode==="loading"){S.backupMsg="記録の読み込みが終わっていないため、まだ読み込めません。読み込みが終わってから、もう一度選んでください。";S.importing=null;$("#view").innerHTML=mapHtml();return}
  const list=S.importing;S.importing=null;let ok=0;
  S.backupMsg="読み込んでいます…";$("#view").innerHTML=mapHtml();
  for(const e of list){
    try{if(S.mode==="db")await retry1(()=>col.doc(e.id).set(strip(e)));else{await Local.put(e);const i=S.entries.findIndex(x=>x.id===e.id);if(i>=0)S.entries[i]=e;else S.entries.push(e)}ok++}
    catch(_){}
  }
  S.backupMsg=ok===list.length?ok+"件を読み込みました。":`${list.length}件のうち${ok}件を読み込みました。残りは保存できませんでした。`;
  refresh();
}

/* ---------- detail sheet ---------- */
function renderSheet(focus){
  let o=$("#ov");if(o)o.remove();
  if(!S.detail)return;
  const all=S.entries.length?S.entries:SAMPLES, e=all.find(x=>x.id===S.detail);if(!e){closeSheet();return}
  const tempC=(TEMPS.find(t=>t[0]===e.temp)||[])[1];
  const rows=[["種類",typeLabel(e.type)],["蔵元",e.brewery],["都道府県",e.pref],["特定名称",e.grade],["飲んだ日",(e.date||"").replace(/-/g,".")],["場所",e.place],
   ["味わい",Number.isFinite(e.sweet)&&Number.isFinite(e.body)?SWEET[e.sweet+2]+"・"+BODY[e.body+2]:""],["温度",e.temp?e.temp+(tempC?"（"+tempC+"）":""):""],
   ["日本酒度",e.smv!==""&&e.smv!=null?(+e.smv>0?"+":"")+e.smv:""],["精米歩合",e.polish?e.polish+"%":""],["度数",e.abv?e.abv+"%":""],["価格",e.price?Number(e.price).toLocaleString("ja-JP")+"円":""]].filter(r=>r[1]);
  o=document.createElement("div");o.className="overlay";o.id="ov";
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dName"><div class="hero"><div class="pic">${picHtml(e)}</div>
   <div><h3 id="dName">${esc(e.name)}</h3>${cupsSvg(e.rating||0)}${e.sample?`<p class="sub" style="font-size:12px;color:var(--muted)">見本の記録です</p>`:""}</div></div>
   <dl class="spec">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
   ${e.memo?`<div class="memo">${esc(e.memo)}</div>`:""}
   ${S.confirm?`<div class="confirm">「${esc(e.name)}」の記録を削除します。元に戻せません。<div class="actions"><button class="btn ghost" id="dNo">やめる</button><button class="btn danger" id="dYes">削除する</button></div></div>`:
   `<div class="actions">${e.sample?"":`<button class="btn ghost" id="dDel">削除</button><button class="btn ghost" id="dEdit">直す</button><button class="btn ghost" id="dAgain">同じ酒をもう一杯</button>`}<button class="btn" id="dClose">閉じる</button></div>`}</div>`;
  document.body.appendChild(o);
  o.addEventListener("click",ev=>{if(ev.target===o)closeSheet()});
  const on=(id,fn)=>{const b=o.querySelector(id);if(b)b.addEventListener("click",fn)};
  on("#dClose",()=>closeSheet());
  on("#dDel",()=>{S.confirm=true;renderSheet(true)});
  on("#dNo",()=>{S.confirm=false;renderSheet(true)});
  on("#dYes",async ev=>{ev.currentTarget.disabled=true;try{await remove(e.id);S.lastCard=null;closeSheet();toast("削除しました")}catch(_){toast("削除できませんでした");S.confirm=false;renderSheet(true)}});
  on("#dEdit",()=>{S.draft=Object.assign(blankDraft(),e);closeSheet(true);go("form")});
  on("#dAgain",()=>{S.draft=Object.assign(blankDraft(),e,{id:null,date:today(),memo:"",photo:e.photo||""});closeSheet(true);go("form")});
  if(focus)(o.querySelector("#dClose")||o.querySelector("#dNo")).focus();
}
function closeSheet(leaving){
  S.detail=null;S.confirm=false;const o=$("#ov");if(o)o.remove();
  if(leaving!==true&&S.lastCard){const c=document.querySelector(`.card[data-id="${CSS.escape(S.lastCard)}"]`);if(c)c.focus()}
}
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&S.detail)closeSheet()});

/* ---------- nav & events ---------- */
function go(v){if(v==="form"&&!S.draft)S.draft=blankDraft();S.view=v;render();window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{
  if(S.view==="form")readForm();                       // keep what was typed when leaving the form
  if(b.dataset.view==="form"&&S.view!=="form"&&S.draft&&S.draft.id)S.draft=null; // an unfinished edit is not resumed as a new record
  go(b.dataset.view)}));
document.addEventListener("click",ev=>{
  if(ev.target.id==="resync"){subscribe();return}
  if(ev.target.id==="reloadApp"){location.reload();return}
  if(ev.target.id==="hintClose"){S.hint=false;try{localStorage.setItem(HINT_KEY,"1")}catch(_){}renderChrome()}
});
$("#view").addEventListener("click",ev=>{
  const c=ev.target.closest(".card");if(c){S.detail=c.dataset.id;S.lastCard=c.dataset.id;S.confirm=false;renderSheet(true);return}
  const t=ev.target.closest("[data-type]");if(t){S.type=t.dataset.type;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.type===S.type));renderResults();return}
  const p=ev.target.closest(".tile");if(p){S.pref=p.dataset.pref;S.type="all";go("list");return}
  const id=ev.target.id;
  if(id==="clearPref"){S.pref=null;render()}
  else if(id==="expBtn")exportAll();
  else if(id==="impNo"){S.importing=null;$("#view").innerHTML=mapHtml()}
  else if(id==="impYes")runImport();
});
// search: don't touch the box itself, and wait for Japanese input (IME) to be confirmed
function onSearch(ev){if(ev.isComposing)return;S.q=ev.target.value;renderResults()}
$("#view").addEventListener("input",ev=>{if(ev.target.id==="q")onSearch(ev)});
$("#view").addEventListener("compositionend",ev=>{if(ev.target.id==="q")onSearch(ev)});
$("#view").addEventListener("change",ev=>{
  if(ev.target.id==="sort"){S.sort=ev.target.value;renderResults()}
  else if(ev.target.id==="impFile"){const f=ev.target.files&&ev.target.files[0];if(f)readImport(f)}
});
let tt;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},2200)}

boot();
})();
</script>
</body>
</html>
